# Application runs locally on http://localhost:8080
server.port=8080
spring.application.name=todo-api

# H2 in-memory database configuration.
# The database is created when the app starts and removed when the app stops.
spring.datasource.url=jdbc:h2:mem:todo_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Creates/updates database tables based on JPA entities.
# Good for learning. For production, use Flyway/Liquibase migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enables H2 web console: http://localhost:8080/h2-console
# JDBC URL in the console: jdbc:h2:mem:todo_db
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Avoids database access from the web layer after the service layer is done.
spring.jpa.open-in-view=false
